{% if include.title %}
  <h2>{{ include.title }}</h2>
{% endif %}

{% if include.subtitle %}
  <p class="list-subtitle">{{ include.subtitle }}</p>
{% endif %}

<div class="models-grid items-grid">
  {% for model in include.collection %}
    {% if model.title %}
      {% include model_card.html model=model %}
    {% endif %}
  {% endfor %}
</div>
