baseurl: "/museum"
url: "https://yprits.github.io"
title: "Моя коллекция"
remote_theme: pages-themes/hacker@v0.2.0

collections:
  exhibits:
    output: true
    permalink: /:collection/:name/
  models:
    output: true
    permalink: /:collection/:name/
  pgs:
    output: true
    permalink: /:collection/:name/
  ephemera:
    output: true
    permalink: /:collection/:name/
  literature:
    output: true
    permalink: /:collection/:name/
  kunstkamera:
    output: true
    permalink: /:collection/:name/
  time_exhibits:
    output: true
    permalink: /time/:name/
  time_models:
    output: true
    permalink: /time/models/:name/

defaults:
  - scope:
      path: "_exhibits"
      type: exhibits
    values:
      model_ref: "не указана"
      category: "прочее"
      prodyear: "не указан"
      modelyears: "неизвестны"
      serial: "-"
      manufacturer: "неизвестен"
      country: "неизвестна"
      price: "не указана"
      condition: "не проверено"
  - scope:
      path: "_models"
      type: models
    values:
      status: "ПОИСК"
      manufacturer: "неизвестен"
      country: "неизвестна"
      modelyears: "неизвестны"
  - scope:
      path: "_kunstkamera"
      type: kunstkamera
    values:
      prodyear: "не поддается датировке"
      condition: "существует вопреки логике"
  - scope:
      path: "_time_exhibits"
      type: time_exhibits
    values:
      model_ref: "не указана"       # Ссылка на модель/калибр из time_models
      category: "прочее"            # ЧМХ, ЧЦХ и т.д.
      prodyear: "не указан"
      serial: "-"
      manufacturer: "неизвестен"    # Завод (МЧЗ, ПЧЗ, Интеграл)
      country: "неизвестна"
      condition: "не проверено"     # Ходят / стоят / пасхалка
      folk_name: "-"                # Для «Терминаторов» и «Чебурашек»
  - scope:
      path: "_time_models"
      type: time_models
    values:
      status: "ПОИСК"               # Для чеклиста, чего в коллекции еще нет
      manufacturer: "неизвестен"
      country: "неизвестна"
      caliber: "неизвестен"         # Номер механизма/модуля (например, 2209 или 29367)
